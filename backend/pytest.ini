[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    network: 需要外网的冒烟测试（网络不可达时自动 skip；只跑离线集用 -m "not network"）
# 覆盖率只报告不卡门槛：门槛在 scripts/test.sh full 里显式传。
# 原因：按模块跑（pytest tests/tools）天然达不到全量覆盖率，卡门槛会逼人跑全量。
addopts = --cov=app --cov-report=term-missing --cov-report=json:coverage.json
# 测试按模块分目录（各自独立可跑）：
#   tests/provider    provider/model 域（spec/ids/registry/availability/gateway/stream/media）
#   tests/config      应用配置（设置、队列、项目管理、路由冒烟）
#   tests/session     会话（WS 对话、持久化、压缩、子 Agent、计划模式）
#   tests/workflow    工作流 + 编排（含 llm 节点、表达式、人工闸门）
#   tests/tools       工具（fs / web / 检索 / 安全策略 / 记忆）
#   tests/plugins     插件 + MCP + Skill
#   tests/kernel      内核契约（hub、util、时间/状态常量、结构护栏）
#   tests/contracts   前后端契约 fixture（真实响应快照，前端 vitest 直接读）
# 跑单个模块：pytest tests/tools -q
# 覆盖率门槛：当前基线约 82%，留 4 个点余量，防止新代码大幅拉低；只降不升要说明理由。
# omit / exclude_lines 在 backend/.coveragerc —— pytest-cov 不读本文件的 [coverage:*] 段。
